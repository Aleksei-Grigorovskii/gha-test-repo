name: Manual Approval Test

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  approval:
    name: Await Manual Approval
    runs-on: ubuntu-latest
    steps:
      - name: Manual Approval Gate
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: "Aleksei-Grigorovskii"
          minimum-approvals: 1
          issue-title: "Approve Test Job"
          issue-body: |
            Этот тестовый workflow приостановлен до вашего подтверждения.
            Оставьте комментарий "approve" на созданном issue для продолжения,
            или "deny" для отмены.

  test:
    name: Run Test Command
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Print Test Message
        run: echo "Тест пройден - approval получен ✅"
        
